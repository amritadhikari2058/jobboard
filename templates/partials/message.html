<div class="alert alert-{{ variant }} alert-dismissible fade show d-flex align-items-start gap-2 mb-3"
     role="alert"{% if auto == 'true' %} data-jb-autodismiss="true"{% endif %}>
    <i class="bi {{ icon }} mt-1" aria-hidden="true"></i>
    <div class="flex-grow-1">{{ message }}</div>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Dismiss message"></button>
</div>
