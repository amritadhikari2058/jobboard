<div class="card h-100">
    <div class="card-body jb-stat">
        <span class="jb-stat-icon {{ icon_class|default:'text-primary' }}" aria-hidden="true">
            <i class="bi {{ icon }}"></i>
        </span>
        <p class="jb-stat-value">{{ value }}</p>
        <p class="jb-stat-label">{{ label }}</p>
    </div>
</div>
