{% load static %}

<nav class="jb-navbar" aria-label="Primary">
    <div class="container-fluid">
        <div class="d-flex align-items-center gap-2 w-100">

            {% if user.is_authenticated %}
                <button class="btn btn-light jb-icon-btn d-lg-none" type="button"
                        data-bs-toggle="offcanvas" data-bs-target="#jbSidebar"
                        aria-controls="jbSidebar" aria-label="Open navigation menu">
                    <i class="bi bi-list" aria-hidden="true"></i>
                </button>
            {% endif %}

            <a class="jb-brand" href="{% url 'jobs:job_list' %}">
                <span class="jb-brand-mark"><i class="bi bi-briefcase-fill" aria-hidden="true"></i></span>
                <span>JobBoard</span>
            </a>

            <div class="ms-auto d-flex align-items-center gap-2">

                {% if user.is_authenticated %}

                    <a class="jb-bell" href="{% url 'notifications:notifications' %}"
                       aria-label="Notifications{% if unread_notification_count %}, {{ unread_notification_count }} unread{% endif %}">
                        <i class="bi bi-bell" aria-hidden="true"></i>
                        {% if unread_notification_count %}
                            <span class="jb-bell-count">{{ unread_notification_count }}</span>
                        {% endif %}
                    </a>

                    <a href="{% url 'users:view_user_profile' user.email %}"
                       class="jb-avatar-link d-none d-md-inline-flex"
                       title="{{ user_display_name }} ({{ user.email }})">
                        <img src="{{ user_avatar_url }}"
                             alt="{{ user_display_name }}"
                             class="jb-avatar">
                    </a>

                    <form method="post" action="{% url 'users:logout' %}" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-light">
                            <i class="bi bi-box-arrow-right me-1" aria-hidden="true"></i>Log out
                        </button>
                    </form>

                {% else %}

                    <a href="{% url 'users:login' %}" class="btn btn-sm btn-light">Log in</a>
                    <a href="{% url 'users:register' %}" class="btn btn-sm btn-primary">Get started</a>

                {% endif %}

            </div>
        </div>
    </div>
</nav>
