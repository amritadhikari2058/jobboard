{% extends "base.html" %}

{% block title %}Delete Application{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6 col-md-8">

            <div class="card border-0 shadow-sm rounded-4">

                <div class="card-body p-5 text-center">

                    <!-- Warning Icon -->

                    <div class="mb-4">

                        <div class="bg-danger-subtle rounded-circle d-inline-flex align-items-center justify-content-center"
                             style="width:80px;height:80px;">

                            <i class="bi bi-trash3-fill text-danger fs-1"></i>

                        </div>

                    </div>

                    <!-- Heading -->

                    <h3 class="fw-bold mb-3">
                        Delete Application?
                    </h3>

                    <p class="text-muted mb-4">

                        You are about to permanently delete your application for

                        <strong>{{ application.job.title }}</strong>.

                    </p>

                    <div class="alert alert-warning border-0">

                        <i class="bi bi-exclamation-triangle-fill me-2"></i>

                        This action cannot be undone.

                    </div>

                    <!-- Buttons -->

                    <form method="POST" class="mt-4">

                        {% csrf_token %}

                        <div class="d-flex justify-content-center gap-3 flex-wrap">

                            <a href="#"
                               onclick="event.preventDefault(); window.history.back();"
                               class="btn btn-outline-secondary rounded-pill px-4">

                                <i class="bi bi-arrow-left me-2"></i>

                                Cancel

                            </a>

                            <button type="submit"
                                    class="btn btn-danger rounded-pill px-4">

                                <i class="bi bi-trash3 me-2"></i>

                                Delete Application

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
