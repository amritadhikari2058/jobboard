{% extends "base.html" %}
{% block title %}Update Application{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card border-0 shadow-lg rounded-4">

                <div class="card-body p-5">

                    <!-- Header -->

                    <div class="text-center mb-4">

                        <div class="display-6 text-primary mb-2">

                            <i class="bi bi-pencil-square"></i>

                        </div>

                        <h2 class="fw-bold">

                            Update Application

                        </h2>

                        <p class="text-muted mb-0">

                            Change the current application status.

                        </p>

                    </div>

                    <hr class="mb-4">

                    <form method="POST" enctype="multipart/form-data">

                        {% csrf_token %}

                        <div class="mb-4">

                            <label class="form-label fw-semibold">

                                Application Status

                            </label>

                            <select name="status" class="form-select form-select-lg">

                                <option value="pending"
                                    {% if application.status == "pending" %}selected{% endif %}>

                                    Pending

                                </option>

                                <option value="accepted"
                                    {% if application.status == "accepted" %}selected{% endif %}>

                                    Accepted

                                </option>

                                <option value="rejected"
                                    {% if application.status == "rejected" %}selected{% endif %}>

                                    Rejected

                                </option>

                            </select>

                            <div class="form-text">

                                Updating the status will notify the applicant.

                            </div>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="#"
                               onclick="event.preventDefault(); window.history.back();"
                               class="btn btn-outline-secondary rounded-pill px-4">

                                <i class="bi bi-arrow-left me-2"></i>

                                Cancel

                            </a>

                            <button type="submit"
                                    class="btn btn-success rounded-pill px-4">

                                <i class="bi bi-check-circle me-2"></i>

                                Update Status

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
