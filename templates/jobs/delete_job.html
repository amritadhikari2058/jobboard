{% extends 'base.html' %}

{% block title %}Delete Job{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <div class="card border-0 shadow-sm delete-card">

                <div class="card-body p-5 text-center">

                    <!-- Icon -->
                    <div class="mb-4">

                        <div class="delete-icon mx-auto">
                            <i class="bi bi-trash3-fill"></i>
                        </div>

                    </div>

                    <!-- Heading -->
                    <h2 class="fw-bold mb-3">
                        Delete Job
                    </h2>

                    <p class="text-muted mb-4">
                        You are about to permanently delete the following job posting.
                    </p>

                    <div class="alert alert-light border">

                        <h5 class="mb-1 fw-semibold">
                            {{ job.title }}
                        </h5>

                        <small class="text-muted">
                            {{ job.location }}
                        </small>

                    </div>

                    <p class="text-danger small mb-4">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        This action cannot be undone.
                    </p>

                    <form method="POST">

                        {% csrf_token %}

                        <div class="d-flex justify-content-center gap-3">

                            <a href="{% url 'jobs:job_list' %}"
                               class="btn btn-outline-secondary px-4">

                                Cancel

                            </a>

                            <button type="submit"
                                    class="btn btn-danger px-4">

                                <i class="bi bi-trash3 me-2"></i>

                                Delete Job

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<style>

.delete-card{
    border-radius:18px;
}

.delete-icon{
    width:80px;
    height:80px;
    border-radius:50%;
    background:#ffe5e5;
    color:#dc3545;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2rem;
}

.delete-card .btn{
    min-width:140px;
    border-radius:10px;
}

</style>

{% endblock %}
